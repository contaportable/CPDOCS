<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="520" height="620" rx="18" fill="#ffffff" stroke="#e5e0f0" stroke-width="2"/>
  <rect x="0" y="0" width="520" height="150" rx="18" fill="#E91E8C"/>
  <rect x="0" y="120" width="520" height="30" fill="#E91E8C"/>
  <circle cx="80" cy="75" r="44" fill="#ffffff"/>
  <text x="80" y="90" font-size="46" font-weight="bold" fill="#E91E8C" text-anchor="middle">1</text>
  <text x="150" y="65" font-size="26" font-weight="bold" fill="#ffffff">FASE 1</text>
  <text x="150" y="98" font-size="19" fill="#ffffff">Evento de Invalidación</text>

  <text x="40" y="195" font-size="16" font-weight="bold" fill="#333333">Síntesis de la fase</text>
  <line x1="40" y1="205" x2="480" y2="205" stroke="#eeeeee" stroke-width="2"/>

  <g font-size="16" fill="#333333">
    <circle cx="50" cy="240" r="6" fill="#E91E8C"/>
    <text x="70" y="246">Nuevo evento de invalidación de DTE</text>

    <circle cx="50" cy="280" r="6" fill="#E91E8C"/>
    <text x="70" y="286">Ampliación de tiempos permitidos para</text>
    <text x="70" y="308">invalidar, según el tipo de documento</text>

    <circle cx="50" cy="342" r="6" fill="#E91E8C"/>
    <text x="70" y="348">Actualización del Lector de JSON</text>

    <circle cx="50" cy="382" r="6" fill="#E91E8C"/>
    <text x="70" y="388">Sin parametrización adicional —</text>
    <text x="70" y="410">disponible automáticamente</text>
  </g>

  <rect x="40" y="450" width="440" height="110" rx="10" fill="#FCE9F3"/>
  <text x="60" y="482" font-size="14" font-weight="bold" fill="#E91E8C">Impacto principal</text>
  <text x="60" y="508" font-size="14" fill="#555555">Más flexibilidad operativa al invalidar</text>
  <text x="60" y="528" font-size="14" fill="#555555">documentos electrónicos según su tipo.</text>

  <text x="260" y="595" font-size="12" fill="#aaaaaa" text-anchor="middle">ContaPortable · Normativa DTE V2.0</text>
</svg>
