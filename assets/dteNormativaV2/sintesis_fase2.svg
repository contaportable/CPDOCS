<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="520" height="760" rx="18" fill="#ffffff" stroke="#e5e0f0" stroke-width="2"/>
  <rect x="0" y="0" width="520" height="150" rx="18" fill="#F5821F"/>
  <rect x="0" y="120" width="520" height="30" fill="#F5821F"/>
  <circle cx="80" cy="75" r="44" fill="#ffffff"/>
  <text x="80" y="90" font-size="46" font-weight="bold" fill="#F5821F" text-anchor="middle">2</text>
  <text x="150" y="60" font-size="26" font-weight="bold" fill="#ffffff">FASE 2</text>
  <text x="150" y="90" font-size="18" fill="#ffffff">Evento de Retorno y</text>
  <text x="150" y="112" font-size="18" fill="#ffffff">Nuevas Versiones DTE</text>

  <text x="40" y="195" font-size="16" font-weight="bold" fill="#333333">Síntesis de la fase</text>
  <line x1="40" y1="205" x2="480" y2="205" stroke="#eeeeee" stroke-width="2"/>

  <g font-size="15.5" fill="#333333">
    <circle cx="50" cy="238" r="6" fill="#F5821F"/>
    <text x="70" y="244">Evento de Retorno para FE, FSEE y FEXE</text>

    <circle cx="50" cy="270" r="6" fill="#F5821F"/>
    <text x="70" y="276">RG del evento de retorno + configuración</text>
    <text x="70" y="296">de formatos</text>

    <circle cx="50" cy="328" r="6" fill="#F5821F"/>
    <text x="70" y="334">Invalidar eventos de retorno</text>

    <circle cx="50" cy="360" r="6" fill="#F5821F"/>
    <text x="70" y="366">Menú contextual del evento: Ver RG,</text>
    <text x="70" y="386">extraer JSON, invalidar, enviar email</text>

    <circle cx="50" cy="418" r="6" fill="#F5821F"/>
    <text x="70" y="424">Envío automático por email (invalidación</text>
    <text x="70" y="444">y retorno)</text>

    <circle cx="50" cy="476" r="6" fill="#F5821F"/>
    <text x="70" y="482">Lector JSON actualizado (esquemas</text>
    <text x="70" y="502">25/may/2026): anexos, OC/OG, libros</text>

    <circle cx="50" cy="534" r="6" fill="#F5821F"/>
    <text x="70" y="540">Manejo de saldo del DTE por eventos</text>
    <text x="70" y="560">de retorno relacionados</text>

    <circle cx="50" cy="592" r="6" fill="#F5821F"/>
    <text x="70" y="598">Eventos de retorno en reportes de</text>
    <text x="70" y="618">clientes, inventario e impuestos</text>
  </g>

  <rect x="40" y="650" width="440" height="80" rx="10" fill="#FDEBD9"/>
  <text x="60" y="678" font-size="14" font-weight="bold" fill="#F5821F">Impacto principal</text>
  <text x="60" y="702" font-size="14" fill="#555555">Ciclo completo del Evento de Retorno,</text>
  <text x="60" y="720" font-size="14" fill="#555555">integrado a facturación, reportes y envíos.</text>

  <text x="260" y="748" font-size="12" fill="#aaaaaa" text-anchor="middle">ContaPortable · Normativa DTE V2.0</text>
